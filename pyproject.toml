[project]
name = "InquirerPy"
version = "0.3.5"
description = "Python port of Inquirer.js (A collection of common interactive command-line user interfaces)"
authors = [
  {name = "Kevin Zhuang", email = "kevin7441@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["cli", "prompt-toolkit", "commandline", "inquirer", "development"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Unix",
  "Operating System :: Microsoft",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
  "prompt-toolkit>=3.0.28",
]

[project.urls]
Repository = "https://github.com/yolabingo/InquirerPy"
Documentation = "https://inquirerpy.readthedocs.io"

[project.optional-dependencies]
docs = [
  "Sphinx>=7.0",
  "furo>=2024.1.29",
  "sphinx-copybutton>=0.5",
  "sphinx-autobuild>=2024.2.4",
  "myst-parser>=3.0",
]
dev = [
  "pre-commit>=3.5",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["InquirerPy"]
artifacts = ["InquirerPy/py.typed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]
ignore = ["D107", "D100", "D104", "E501", "E731"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["InquirerPy"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]
"InquirerPy/_pfzy/**" = ["D"]

[tool.coverage.run]
source = ["InquirerPy"]

[tool.coverage.report]
ignore_errors = true
exclude_lines = [
    "if TYPE_CHECKING:"
]
